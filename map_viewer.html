<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>KMZ Secure Viewer</title>
    
    <!-- استدعاء ملفات التنسيق -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        html, body, #map { height: 100%; margin: 0; padding: 0; background-color: #f8fafc; font-family: sans-serif; }
        #error-box { display: none; position: absolute; top: 10px; left: 10px; right: 10px; background: rgba(223, 44, 47, 0.9); color: white; padding: 15px; z-index: 9999; text-align: center; border-radius: 8px; font-weight: bold; direction: rtl; line-height: 1.6; }
        #error-box a { color: #ffeb3b; text-decoration: underline; word-break: break-all; }
    </style>

    <!-- مكتبة Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    
    <div id="error-box"></div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-kmz@latest/dist/leaflet-kmz.js"></script>
    <script src="https://unpkg.com/leaflet-omnivore@0.3.4/leaflet-omnivore.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

    <script>
        function showError(msg) {
            document.getElementById('error-box').style.display = 'block';
            document.getElementById('error-box').innerHTML = msg;
        }

        var map = L.map('map').setView([21.4225, 39.8261], 12);
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Tiles &copy; Esri'
        }).addTo(map);

        // ========================================================
        // المفاتيح المظبوطة بالملي 
        // ========================================================
        const SUPABASE_URL = 'https://rescepzzyzjzvddfxygp.supabase.co'; 
        const SUPABASE_ANON_KEY = 'sb_publishable__zQ1jKceZqBbA3UxNQkIoQ_Oyf6tJe9';
        const BUCKET_NAME = 'Camps_KMZ'; // تم تصحيح حالة الحروف

        try {
            const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            var urlParams = new URLSearchParams(window.location.search);
            var fileName = urlParams.get('file');

            if (fileName) {
                fileName = fileName.trim();
                if (!fileName.toLowerCase().endsWith('.kmz') && !fileName.toLowerCase().endsWith('.kml')) {
                    fileName += '.kmz';
                }

                // سحب الرابط المشفر الآمن
                supabase.storage.from(BUCKET_NAME).createSignedUrl(fileName, 60).then(function(response) {
                    if (response.error) {
                        showError("عذراً، سوبابيز يرفض إعطاء الخريطة: " + response.error.message + "<br>تأكد أن الملف اسمه (" + fileName + ") موجود في الباكيت.");
                        return;
                    }
                    
                    var secureUrl = response.data.signedUrl; 

                    function renderFixedKML(kmlText) {
                        var fixedKmlText = kmlText.replace(/<LinearRing>/g, '<Polygon><outerBoundaryIs><LinearRing>')
                                                  .replace(/<\/LinearRing>/g, '</LinearRing></outerBoundaryIs></Polygon>');
                        var customLayer = L.geoJson(null, { style: function () { return { color: '#0055ff', weight: 3, opacity: 1, fillOpacity: 0.3 }; } });
                        customLayer.on('layeradd', function() { 
                            var bounds = customLayer.getBounds();
                            if (bounds && bounds.isValid()) map.fitBounds(bounds);
                        });
                        omnivore.kml.parse(fixedKmlText, null, customLayer).on('ready', function() { 
                            setTimeout(function(){ var b = customLayer.getBounds(); if(b.isValid()) map.fitBounds(b); }, 300); 
                        }).addTo(map);
                    }

                    var kmz = L.kmzLayer().addTo(map);
                    kmz.on('load', function(e) {
                        var bounds = e.layer.getBounds();
                        if (bounds && bounds.isValid() && Object.keys(e.layer._layers).length > 0) {
                            map.fitBounds(bounds);
                        } else {
                            fixAndLoadKMZ(secureUrl);
                        }
                    });
                    kmz.on('error', function() { fixAndLoadKMZ(secureUrl); });
                    
                    kmz.load(secureUrl);

                    function fixAndLoadKMZ(url) {
                        fetch(url).then(res => {
                            if(!res.ok) throw new Error(`فشل فتح الخريطة. الرابط المرفوض:<br><a href="${url}" target="_blank">اضغط هنا للتجربة</a>`);
                            return res.arrayBuffer();
                        }).then(buffer => JSZip.loadAsync(buffer)).then(zip => {
                            var kmlFilename = Object.keys(zip.files).find(name => name.toLowerCase().endsWith('.kml'));
                            if (kmlFilename) return zip.files[kmlFilename].async("string");
                        }).then(kmlText => { if (kmlText) renderFixedKML(kmlText); }).catch(err => showError(err.message));
                    }
                });
            }
        } catch (e) {
            showError("خطأ في الاتصال: " + e.message);
        }
    </script>
</body>
</html>
