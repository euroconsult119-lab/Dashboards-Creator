<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>KMZ Viewer (Supabase)</title>
    
    <!-- استدعاء ملفات التنسيق لمكتبة Leaflet المجانية -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        html, body, #map { height: 100%; margin: 0; padding: 0; font-family: sans-serif; background-color: #f8fafc; }
        .error-msg { display: flex; justify-content: center; align-items: center; height: 100%; color: #df2c2f; font-weight: bold; font-size: 18px; text-align: center; padding: 20px; }
    </style>

    <!-- مكتبة Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div id="map"></div>

    <!-- استدعاء مكتبة Leaflet الأساسية -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <!-- استدعاء مكتبة قراءة ملفات KMZ -->
    <script src="https://unpkg.com/leaflet-kmz@latest/dist/leaflet-kmz.js"></script>

    <script>
        // 1. ضع مفاتيح مشروعك في Supabase هنا
        const SUPABASE_URL = 'https://rescepzzyzjzvddfxygp.supabase.co'; 
        const SUPABASE_ANON_KEY = 'sb_publishable__zQ1jKceZqBbA3UxNQkIoQ_Oyf6tJe9';
        const BUCKET_NAME = 'CAMPS_KMZ';

        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // 2. إعداد الخريطة والمركز الافتراضي (مكة المكرمة) [نفس كودك القديم]
        var map = L.map('map').setView([21.4225, 39.8261], 12);

        // 3. إضافة طبقة الأقمار الصناعية المجانية (Esri World Imagery)
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Tiles &copy; Esri'
        }).addTo(map);

        // 4. قراءة اسم الملف من متغيرات الرابط
        var urlParams = new URLSearchParams(window.location.search);
        var fileName = urlParams.get('file');

        if (fileName) {
            fileName = fileName.trim();
            
            // إضافة .kmz تلقائياً إذا نسيها المستخدم في الشيت
            if (!fileName.toLowerCase().endsWith('.kmz')) {
                fileName += '.kmz';
            }

            // 5. جلب الرابط المشفر للـ KMZ من Supabase
            supabase.storage.from(BUCKET_NAME).createSignedUrl(fileName, 60).then(function(response) {
                if (response.error) {
                    document.getElementById('map').innerHTML = `<div class="error-msg" dir="rtl">عذراً، الخريطة غير متاحة.<br><br>تأكد من رفع ملف "${fileName}" في Supabase.</div>`;
                    return;
                }
                
                var secureKmzUrl = response.data.signedUrl; 

                // 6. تحميل وعرض ملف الـ KMZ على الخريطة (نفس كودك القديم الناجح)
                var kmz = L.kmzLayer().addTo(map);
                
                kmz.on('load', function(e) {
                    var bounds = e.layer.getBounds();
                    if (bounds.isValid()) {
                        // عمل Zoom تلقائي على حدود المشروع بمجرد تحميله
                        map.fitBounds(bounds);
                    }
                });
                
                // تنفيذ التحميل من الرابط الآمن
                kmz.load(secureKmzUrl);
            });
        } else {
            document.getElementById('map').innerHTML = `<div class="error-msg" dir="rtl">لم يتم تمرير اسم الخريطة.</div>`;
        }
    </script>
</body>
</html>
